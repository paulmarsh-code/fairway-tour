# nginx site for Fairway Tour Planner, alongside your existing sites.
# 1. Replace golf.example.co.uk with your subdomain (2 places).
# 2. sudo cp deploy/nginx-fairway.conf /etc/nginx/sites-available/fairway
#    sudo ln -s /etc/nginx/sites-available/fairway /etc/nginx/sites-enabled/fairway
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d golf.example.co.uk     (adds HTTPS and the redirect)

server {
    listen 80;
    listen [::]:80;
    server_name golf.example.co.uk;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading several clubs' live tee sheets can take a couple of minutes
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
