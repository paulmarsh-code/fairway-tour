<!doctype html>
<html><head><meta charset="utf-8"><title>Visitor booking</title></head>
<body>
<header><a href="/">Home</a> <a href="/contact">Contact</a></header>
<div id="cookie"><button onclick="this.parentNode.remove()">Reject all</button></div>
<h1 id="h"></h1>
<div id="sheet"></div>
<script>
// Renders like a JS booking app: the tee sheet appears after load, for the date in ?date=DD-MM-YYYY
setTimeout(() => {
  const p = new URLSearchParams(location.search).get("date") || "";
  const [d, m, y] = p.split("-");
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("h").textContent = `Tee times for ${Number(d)} ${months[Number(m)-1]} ${y}`;
  const rows = [
    ["08:00", "Members only", false], ["08:10", "Booked", false], ["09:30", "£85.00 · 4 spaces", true],
    ["09:40", "£85.00 · 1 space", true], ["10:20", "£95.00 · 3 spaces", true], ["11:00", "Competition", false]
  ];
  document.getElementById("sheet").innerHTML = rows.map(([t, info, ok]) =>
    `<div class="slot ${ok ? "" : "unavailable"}"><span class="time">${t}</span><span class="info">${info}</span>${ok ? '<button>Book</button>' : ''}</div>`).join("");
}, 400);
</script>
</body></html>
